<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Measurements Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 5px;
        }

        #status {
            margin-bottom: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

    <h1>Measurements Dashboard</h1>

    <div id="status">
        Loading measurements...
    </div>

    <table id="measurementsTable">
        <thead>
            <tr>
                <th>Time</th>
                <th>Device</th>
                <th>Temperature</th>
                <th>Humidity</th>
                <th>Pressure</th>
                <th>Light</th>
                <th>CO₂</th>
                <th>SCD Temperature</th>
                <th>SCD Humidity</th>
            </tr>
        </thead>

        <tbody id="measurementsBody">
        </tbody>
    </table>

    <script>

        // ==================================================
        // Supabase
        // ==================================================

        const SUPABASE_URL =
            "https://lzxassblxelsxvlhpzvr.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_71VobEuMPtPvhVpsAZ_w_A_qpjRMThj";


        // ==================================================
        // Load measurements
        // ==================================================

        async function loadMeasurements() {

            const status = document.getElementById("status");
            const tableBody = document.getElementById("measurementsBody");

            try {

                const response = await fetch(
                    SUPABASE_URL +
                    "/rest/v1/measurements" +
                    "?select=*" +
                    "&order=created_at.desc" +
                    "&limit=5",
                    {
                        method: "GET",

                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": "Bearer " + SUPABASE_KEY
                        }
                    }
                );

                if (!response.ok) {

                    throw new Error(
                        "HTTP " + response.status +
                        ": " + await response.text()
                    );
                }

                const measurements = await response.json();

                tableBody.innerHTML = "";

                measurements.forEach(function(measurement) {

                    const row = document.createElement("tr");

                    row.innerHTML =
                        "<td>" + measurement.created_at + "</td>" +
                        "<td>" + measurement.device_id + "</td>" +
                        "<td>" + measurement.temperature + "</td>" +
                        "<td>" + measurement.humidity + "</td>" +
                        "<td>" + measurement.pressure + "</td>" +
                        "<td>" + measurement.light + "</td>" +
                        "<td>" + measurement.co2 + "</td>" +
                        "<td>" + measurement.scd_temperature + "</td>" +
                        "<td>" + measurement.scd_humidity + "</td>";

                    tableBody.appendChild(row);
                });

                status.textContent =
                    "Successfully loaded " +
                    measurements.length +
                    " measurements.";

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "Error loading measurements: " +
                    error.message;
            }
        }


        // ==================================================
        // Start
        // ==================================================

        loadMeasurements();

    </script>

</body>
</html>
